[project]
name = "moyo-experiment-platform"
version = "4.0.0"
description = "在线双人战争游戏实验平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "aiomysql>=0.2.0,<1",
    "pymysql>=1.1.1,<2",
    "alembic>=1.13,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "argon2-cffi>=23.1,<26",
    "cryptography>=43,<47",
    "itsdangerous>=2.2,<3",
    "pillow>=10.4,<13",
    "openpyxl>=3.1,<4",
    "markdown-it-py>=3.0,<5",
    "nh3>=0.2.18,<1",
    "python-multipart>=0.0.9,<1",
    "python-dateutil>=2.9,<3",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "websockets>=13,<16",
    "playwright>=1.48,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "unit: 不依赖数据库的单元测试",
    "integration: 使用真实 uvicorn、MariaDB 和 WebSocket 的集成测试",
    "jatos: 使用真实 JATOS 的测试",
    "e2e: Playwright 端到端测试",
]

[tool.uv]
package = false
