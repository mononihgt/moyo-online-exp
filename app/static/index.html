<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas Two-Player Online Game</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#eef2f7;color:#17202a;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}#top{display:flex;gap:10px;align-items:center;padding:10px;background:white;flex-wrap:wrap;flex:0 0 auto}input,select,button{padding:7px}#status{font-weight:700}.wrap{position:relative;flex:1 1 auto;min-height:220px}canvas{width:100%;height:100%;display:block;touch-action:manipulation}.actionbar{flex:0 0 auto;padding:10px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:white;border-top:1px solid #d7dee8;display:flex;justify-content:center}.confirm-button{width:min(520px,100%);min-height:52px;border:0;border-radius:12px;background:#17202a;color:white;font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation}.confirm-button:disabled{opacity:.45;cursor:not-allowed}.confirm-button:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.78);color:white;text-align:center}.overlay.show{display:flex}.panel{padding:28px;border:1px solid rgba(255,255,255,.4);border-radius:14px;background:rgba(15,23,42,.9);max-width:min(560px,calc(100% - 24px))}@media(max-width:600px){#top{gap:6px;padding:8px;font-size:13px}#top label{display:flex;align-items:center;gap:4px}#top input{width:54px;padding:6px}#connect{min-height:40px}.wrap{min-height:180px}.actionbar{padding-top:8px}.confirm-button{min-height:56px;font-size:18px}.panel{padding:20px 16px}}
</style></head><body>
<div id="top"><label>rows <input id="rows" type="number" value="6" min="6" max="6" readonly></label><label>columns <input id="cols" type="number" value="6" min="6" max="6" readonly></label><span id="trialInfo" style="font-weight:700">7 trials: 1 practice + 6 formal</span><button id="connect">start matching</button><span id="status">not connected</span><span id="role" style="font-weight:700"></span></div>
<div class="wrap"><canvas id="c"></canvas><div id="overlay" class="overlay"><div class="panel"><h2 id="ovTitle"></h2><p id="ovText"></p></div></div></div>
<div class="actionbar"><button id="confirmDecision" class="confirm-button" type="button" disabled>Confirm Decision</button></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),statusEl=document.getElementById('status'),roleEl=document.getElementById('role'),overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText'),confirmDecision=document.getElementById('confirmDecision');let ws=null,board=null,rows=6,cols=6,selected=new Set(),phase='idle',submitted=false,flash=new Set(),deadline=0,timer=null,currentGame=0,currentTurn=0,currentIsPractice=false,currentFormalTrial=0;
function key(r,c){return r+','+c} function canvasSize(){const rect=c.getBoundingClientRect();return {w:rect.width,h:rect.height}} function resize(){const d=devicePixelRatio||1,{w,h}=canvasSize();c.width=Math.max(1,Math.round(w*d));c.height=Math.max(1,Math.round(h*d));ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function draw(){const {w:cw,h:ch}=canvasSize();ctx.clearRect(0,0,cw,ch);if(!board)return;const pad=Math.min(30,Math.max(12,cw*.04)),w=Math.max(1,cw-2*pad),h=Math.max(1,ch-2*pad),s=Math.max(5,Math.min(w/cols,h/rows)),ox=(cw-s*cols)/2,oy=(ch-s*rows)/2;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const x=ox+col*s,y=oy+r*s,k=key(r,col),code=board.colors[r][col];ctx.fillStyle=selected.has(k)?'#27ae60':code===1?'#3498db':code===2?'#e74c3c':'#fff';ctx.fillRect(x,y,s,s);ctx.strokeStyle=flash.has(k)?'#facc15':'#17202a';ctx.lineWidth=flash.has(k)?Math.max(4,s*.08):1;ctx.strokeRect(x,y,s,s);const fg=code===0&&!selected.has(k)?'#17202a':'#fff';ctx.strokeStyle=fg;ctx.lineWidth=Math.max(2,s*.05);const cx=x+s/2,cy=y+s/2,sh=board.shapes[r][col];if(sh===1){ctx.beginPath();ctx.arc(cx,cy,s*.39,0,Math.PI*2);ctx.stroke()}else if(sh===2){ctx.beginPath();ctx.moveTo(cx,cy-s*.42);ctx.lineTo(cx+s*.42,cy);ctx.lineTo(cx,cy+s*.42);ctx.lineTo(cx-s*.42,cy);ctx.closePath();ctx.stroke()}const n=board.numbers[r][col];if(n!==-1){ctx.fillStyle=fg;ctx.font='700 '+Math.max(10,s*.24)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,cx,cy)}}}
function cellAt(e){if(!board)return null;const rect=c.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,cw=rect.width,ch=rect.height,pad=Math.min(30,Math.max(12,cw*.04)),w=Math.max(1,cw-2*pad),h=Math.max(1,ch-2*pad),s=Math.max(5,Math.min(w/cols,h/rows)),ox=(cw-s*cols)/2,oy=(ch-s*rows)/2;if(x<ox||y<oy||x>=ox+s*cols||y>=oy+s*rows)return null;return [Math.floor((y-oy)/s),Math.floor((x-ox)/s)]}
c.addEventListener('click',e=>{if(phase!=='turn'||submitted)return;const p=cellAt(e);if(p){const k=key(...p);if(selected.has(k))selected.delete(k);else selected.add(k);draw();updateConfirmButton()}});c.addEventListener('contextmenu',e=>{e.preventDefault();if(phase!=='turn'||submitted)return;const p=cellAt(e);if(p){selected.delete(key(...p));draw();updateConfirmButton()}});
function updateConfirmButton(){const canSubmit=!!ws&&ws.readyState===1&&((phase==='turn'&&!submitted&&selected.size>0)||phase==='rest');confirmDecision.disabled=!canSubmit;confirmDecision.textContent=phase==='rest'?'Ready for Next Trial':submitted?'Decision Submitted':'Confirm Decision'}
function submit(){if(!ws||ws.readyState!==1)return;if(phase==='turn'&&!submitted){if(selected.size===0){statusEl.textContent='Select at least one cell before confirming';updateConfirmButton();return}submitted=true;ws.send(JSON.stringify({type:'submit',game:currentGame,turn:currentTurn,cells:[...selected].map(x=>x.split(',').map(Number))}));statusEl.textContent='Submitted, waiting for opponent';updateConfirmButton()}else if(phase==='rest'){ws.send(JSON.stringify({type:'rest_ready'}));ovText.textContent='Ready, waiting for opponent or the 60-second break to end';phase='rest_wait';updateConfirmButton()}}
confirmDecision.addEventListener('click',submit);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();submit()}});
function countdown(seconds,prefix){deadline=Date.now()+seconds*1000;clearInterval(timer);timer=setInterval(()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));statusEl.textContent=prefix+left+' seconds';if(left<=0)clearInterval(timer)},250)}
document.getElementById('connect').onclick=()=>{roleEl.textContent='';phase='matching';updateConfirmButton();rows=+document.getElementById('rows').value;cols=+document.getElementById('cols').value;const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host+'/ws');ws.onopen=()=>ws.send(JSON.stringify({rows,cols}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='waiting')statusEl.textContent='Waiting for a match';else if(m.type==='matched'){statusEl.textContent='Match found';roleEl.textContent=m.player===1?'You are the circle player':'You are the diamond player';}else if(m.type==='state'){rows=m.rows;cols=m.cols;board=m.board;selected.clear();submitted=false;phase=m.phase;currentGame=m.game;currentTurn=m.turn;currentIsPractice=!!m.isPractice;currentFormalTrial=m.formalTrial;overlay.classList.remove('show');flash=new Set((m.flashing||[]).map(p=>key(...p)));if(m.phase==='turn'){countdown(m.seconds,currentIsPractice?`Practice trial, Turn ${m.turn}/${m.turnsPerGame}, remaining: `:`Formal trial ${m.formalTrial}/${m.totalFormal}, Turn ${m.turn}/${m.turnsPerGame}, remaining: `)}else if(m.phase==='turn_result'){statusEl.textContent='Turn results';setTimeout(()=>{flash.clear();draw()},1000)}else if(m.phase==='rest'){phase='rest';overlay.classList.add('show');ovTitle.textContent=currentIsPractice?'Practice trial done':`Formal trial ${m.formalTrial} ended`;ovText.textContent=(currentIsPractice?'This practice trial is not part of formal performance. ':'')+'Both players tap Ready for Next Trial to continue; the break is up to 60 seconds';countdown(m.seconds,'Break remaining: ')}else statusEl.textContent=currentIsPractice?'Practice trial started':`Formal trial ${m.formalTrial} started`;draw();updateConfirmButton()}else if(m.type==='auto_selected')statusEl.textContent=currentIsPractice?`Time expired in the practice trial, turn ${m.turn}: the server selected one random cell`:`Time expired in formal trial ${currentFormalTrial}, turn ${m.turn}: the server selected one random cell`;else if(m.type==='invalid_selection'){submitted=false;statusEl.textContent=m.message||'Select at least one cell';updateConfirmButton()}else if(m.type==='rest_complete'){overlay.classList.remove('show');statusEl.textContent='The next trial will start shortly';phase='starting';updateConfirmButton()}else if(m.type==='game_over'){phase='over';updateConfirmButton();overlay.classList.add('show');ovTitle.textContent='All formal trials completed';ovText.innerHTML='Download the session data below.<br><br><a href="'+m.zipUrl+'" style="color:#93c5fd;font-weight:700">Download analysis data (ZIP)</a><br><a href="'+m.csvUrl+'" style="color:#93c5fd;font-weight:700">Download CSV data</a> &nbsp; <a href="'+m.jsonUrl+'" style="color:#93c5fd;font-weight:700">Download JSON data</a>';statusEl.textContent='All formal trials completed'}else if(m.type==='opponent_left'){phase='over';updateConfirmButton();overlay.classList.add('show');ovTitle.textContent='Opponent left';ovText.textContent='Please refresh the page and match again'}};ws.onclose=()=>{statusEl.textContent='Connection closed';updateConfirmButton()}};resize();
</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"7939e04a4baf43c8b86a560f74aac60e"}' crossorigin="anonymous"></script>
</body></html>
